<!doctype html>
<html data-theme="s">
  <head>
    <meta charset="UTF-8" />
    <title>NotionFlow</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="ipod silicone-case" id="ipod">

      <!-- LCD 섹션 -->
      <div class="lcd-section">
        <div class="bezel">
          <div class="screen">

            <!-- LCD 헤더 -->
            <div class="scr-head">
                <!-- 네온 LED 자물쇠 (좌측) -->
                <svg class="lock-led-icon" id="lock-led-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M7 11V7C7 4.79086 8.79086 3 11 3H13C15.2091 3 17 4.79086 17 7V11M8 11H16C17.1046 11 18 11.8954 18 13V19C18 20.1046 17.1046 21 16 21H8C6.89543 21 6 20.1046 6 19V13C6 11.8954 6.89543 11 8 11Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <circle cx="12" cy="16" r="1.5" fill="currentColor"/>
                </svg>
                
                <div class="month-group">
                  <button type="button" class="month-btn" id="prevMonth">‹</button>
                  <span class="month-label" id="workMonth">2026.05</span>
                  <button type="button" class="month-btn" id="nextMonth">›</button>
                </div>
              <div class="head-right">
                <span class="auto-badge" id="auto-badge">AUTO</span>
              </div>
            </div>

            <div class="work-panel">
              <div class="work-actions">
                <button type="button" class="work-refresh" id="refreshWorklog">↻</button>
              </div>
              <div class="work-panel__meta">
                <div class="work-panel__value">
                  <strong id="loggedDays">4.7D</strong>
                  <span id="targetDays">/ 7D</span>
                </div>
              </div>

              <div class="work-panel__bar">
                <div class="work-panel__bar-fill" id="workProgress" style="width: 67%"></div>
              </div>
            </div>
            <!-- 메인 메뉴 뷰 -->
            <div class="view show" id="menu-view">
              <div class="menu-list" id="mlist"></div>
            </div>

            <!-- 메시지 오버레이 (sync 로딩 + 결과) -->
            <div class="msg-view" id="msg-view">
              <div class="msg-loading" id="msg-loading">
                <span class="msg-main" id="msg-main"></span>
                <span class="msg-sub"  id="msg-sub"></span>
                <div class="msg-prog-wrap" id="msg-prog-wrap">
                <div class="msg-prog-fill" id="msg-prog-fill"></div>
              </div>
              </div>
              <div class="msg-result" id="msg-result">
                <div class="result-check"><div class="check-mark"></div></div>
                <span class="result-title" id="result-title"></span>
                <div class="result-stats" id="result-stats"></div>
                <span class="result-elapsed" id="result-elapsed"></span>
              </div>
            </div>

            <!-- 잠금 화면 -->
            <div class="lock-screen" id="lock-screen">
              <img class="lock-bg-img" id="lock-bg-img" />
              <div class="lock-time" id="lock-time">12:34</div>
              <div class="lock-date" id="lock-date">TUE, MAY 12</div>
              <div class="lock-tap-hint">Tap anywhere to unlock</div>
            </div>

          </div>
        </div>
      </div>

      <!-- 클릭 휠 섹션 -->
      <div class="wheel-section">
        <div class="wheel" id="wheel">
          <div class="wheel-ring"></div>
          <div class="wsec top"    id="btn-up"><span class="wlbl">↑</span></div>
          <div class="wsec bottom" id="btn-down"><span class="wlbl">↓</span></div>
          <div class="wsec left"   id="btn-settings"><span class="wlbl">SET</span></div>
          <div class="wsec right"  id="btn-auto"><span class="wlbl">AUTO</span></div>
          <div class="center-btn"  id="btn-center"><div class="center-dot"></div></div>
        </div>
      </div>

    </div>

    <!-- 설정 팝오버 -->
    <div class="settings-overlay" id="settingsOverlay">
      <div class="settings-mini">
        <!-- 헤더 -->
        <div class="mini-header">
          <h1 class="mini-title">Settings</h1>
          <button class="mini-close" id="closeSettings">×</button>
        </div>

        <!-- 탭 메뉴 -->
        <div class="mini-tabs">
          <button class="mini-tab active" data-tab="accounts">Accounts</button>
          <button class="mini-tab" data-tab="settings">Settings</button>
        </div>

        <!-- 컨텐츠 -->
        <div class="mini-content">
          <!-- Accounts 탭 -->
          <div class="mini-tab-content active" data-content="accounts">
            <!-- API -->
            <div class="mini-section">
              <div class="mini-label">Jira</div>
              <div class="mini-field">
                <input type="text" class="mini-input" id="jiraUrl" placeholder="domain.atlassian.net" />
              </div>
              <div class="mini-field">
                <input type="password" class="mini-input" id="jiraPat" placeholder="Token" />
              </div>
              <div class="mini-field">
                <input type="email" class="mini-input" id="jiraEmail" placeholder="Email (Personal Jira only)" />
              </div>
            </div>

            <div class="mini-section">
              <div class="mini-label">Notion</div>
              <div class="mini-field">
                <input type="password" class="mini-input" id="notionToken" placeholder="Token" />
              </div>
              <div class="mini-field">
                <input type="text" class="mini-input" id="notionSourceJira" placeholder="DB (Jira)" />
              </div>
              <div class="mini-field">
                <input type="text" class="mini-input" id="notionSourcePR" placeholder="DB (PR)" />
              </div>
            </div>

            <div class="mini-section">
              <div class="mini-label">GitHub</div>
              <div class="mini-field">
                <input type="password" class="mini-input" id="githubToken" placeholder="Token" />
              </div>
              <div class="mini-field">
                <input type="text" class="mini-input" id="githubUsername" placeholder="Username" />
              </div>
              <div class="mini-field">
                <input type="text" class="mini-input" id="githubUrl" placeholder="https://github.com" />
              </div>
            </div>
          </div>

          <!-- Settings 탭 -->
          <div class="mini-tab-content" data-content="settings">
            <div class="mini-section">
              <div class="mini-label">Worklog</div>
              <div class="mini-field">
                <input
                  type="number"
                  class="mini-input"
                  id="targetLog"
                  step="0.25"
                  placeholder="Target Day"
                />
              </div>
            </div>
            
            <div class="mini-section">
              <div class="mini-label">Lock Screen Image</div>

              <!-- 잠금화면 미리보기 (드래그로 위치 조정) -->
              <div class="lock-preview" id="lockPreview">
                <div class="lock-preview-placeholder" id="lockPreviewPlaceholder">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 19V5C21 3.89543 20.1046 3 19 3H5C3.89543 3 3 3.89543 3 5V19C3 20.1046 3.89543 21 5 21H19C20.1046 21 21 20.1046 21 19Z" stroke="currentColor" stroke-width="2"/>
                    <path d="M3 16L8 11L13 16M13 10L16 7L21 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
                  </svg>
                  <span>No image</span>
                </div>
                <img class="lock-preview-img" id="lockPreviewImg" />
                <button class="mini-image-remove" id="imageRemove" style="display: none;">×</button>
              </div>

              <!-- 줌 슬라이더 -->
              <div class="lock-zoom-row" id="lockZoomRow" style="display: none;">
                <span class="lock-zoom-label">Zoom</span>
                <input type="range" class="lock-zoom-slider" id="lockZoomSlider" min="1" max="3" step="0.05" value="1" />
                <span class="lock-zoom-val" id="lockZoomVal">1.0×</span>
              </div>

              <div class="mini-image-actions">
                <label class="mini-image-btn">
                  <input type="file" class="mini-file-input" id="lockBgImageFile" accept="image/*" />
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 15V19C21 20.1046 20.1046 21 19 21H5C3.89543 21 3 20.1046 3 19V15M17 8L12 3M12 3L7 8M12 3V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  Upload
                </label>
                <button class="mini-image-btn" id="urlBtn">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 13C10.4295 13.5741 10.9774 14.0492 11.6066 14.3929C12.2357 14.7367 12.9315 14.9411 13.6467 14.9923C14.3618 15.0435 15.0796 14.9404 15.7513 14.6898C16.4231 14.4392 17.0331 14.0471 17.54 13.54L20.54 10.54C21.4508 9.59702 21.9548 8.33362 21.9434 7.02218C21.932 5.71074 21.4061 4.45614 20.4791 3.52909C19.5521 2.60204 18.2975 2.07607 16.986 2.06468C15.6746 2.05329 14.4112 2.55729 13.4682 3.46804L11.75 5.18004" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M14 11C13.5705 10.4259 13.0226 9.95083 12.3934 9.60707C11.7642 9.26331 11.0684 9.05889 10.3533 9.00768C9.63816 8.95646 8.92037 9.05963 8.24861 9.31021C7.57685 9.5608 6.96684 9.95289 6.45996 10.46L3.45996 13.46C2.54917 14.403 2.04517 15.6664 2.05656 16.9778C2.06795 18.2893 2.59392 19.5439 3.52097 20.4709C4.44802 21.398 5.70262 21.9239 7.01406 21.9353C8.3255 21.9467 9.58889 21.4427 10.532 20.532L12.24 18.82" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  URL
                </button>
              </div>

              <!-- URL 입력 (토글) -->
              <div class="mini-url-input" id="urlInput" style="display: none;">
                <input type="text" class="mini-input" id="lockBgImageInput" placeholder="Paste image URL" />
                <button class="mini-url-apply" id="urlApply">Apply</button>
              </div>
            </div>

            <!-- Theme -->
            <div class="mini-section">
              <div class="mini-label">Theme</div>
              <div class="mini-themes">
                <div class="mini-theme theme-s active" data-theme="s"></div>
                <div class="mini-theme theme-bk" data-theme="bk"></div>
                <div class="mini-theme theme-pk" data-theme="pk"></div>
                <div class="mini-theme theme-bl" data-theme="bl"></div>
                <div class="mini-theme theme-gn" data-theme="gn"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- 푸터 -->
        <div class="mini-footer">
          <button class="mini-btn btn-cancel" id="cancelSettings">Cancel</button>
          <button class="mini-btn btn-save" id="saveSettings">Save</button>
        </div>
      </div>
    </div>

    <!-- 컨텍스트 메뉴 -->
    <div class="context-menu" id="contextMenu">
      <div class="context-item" id="ctx-minimize">최소화</div>
      <div class="context-divider"></div>
      <div class="context-item" id="ctx-close">닫기</div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
